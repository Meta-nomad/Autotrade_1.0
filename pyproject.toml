[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-paper-lab"
version = "0.1.3"
description = "Paper-only crypto futures strategy laboratory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<17",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
